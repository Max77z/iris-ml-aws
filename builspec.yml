version: 0.2
 
phases:
 
  pre_build:
    commands:
 
      - echo Logging in to Amazon ECR...
 
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
 
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
 
      #- aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 618246141405.dkr.ecr.ap-south-1.amazonaws.com 
      - REPOSITORY_URI=$ECR_URI/mlops-ecr
      - 
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
 
      - echo Repository URI is $REPOSITORY_URI
 
      - echo Image tag is $IMAGE_TAG
 
 
  build:
    commands:
 
      - echo Build started on `date`
 
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
 
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
 
 
  post_build:
    commands:
 
      - echo Pushing Docker image...
 
      - docker push $REPOSITORY_URI:$IMAGE_TAG
 
      - docker push $REPOSITORY_URI:latest
 
      - echo Creating imagedefinitions.json
 
      - printf '[{"name":"iris-ml-container","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
 
 
artifacts:
  files:
    - imagedefinitions.json